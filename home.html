<form class="searchbox" id="searchbox">
    <input id="searchengine" value="" type="hidden"/>
    <input class="search" id="search" placeholder='Access the database...' type='text'/>
</form>

<style>
    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:ital,wght@0,300;0,400;1,300&display=swap");

    :root {
        --vault-bg: #0d1117;
        --vault-accent: #58a6ff;
        --vault-border: #30363d;
        --vault-text: #c9d1d9;
    }

    body {
        background-color: var(--vault-bg);
        margin: 0;
        overflow: hidden;
        font-family: 'Roboto Mono', monospace;
    }

    .black {
        position: absolute;
        left: 0px;
        opacity: 1;
        display: block;
        top: 0px;
        width: 100%;
        z-index: 100;
        height: 100%;
        background: #000;
    }

    .loadimg {
        position: absolute;
        opacity: 1;
        display: block;
        width: 125px;
        z-index: 101;
        height: 125px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    @keyframes fadeout {
        0% { opacity: 1; pointer-events: none; }
        100% { opacity: 0; display: none; }
    }

    .searchbox {
        width: 50%;
        height: 55px;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
    }

    .search {
        text-align: center;
        border-radius: 4px;
        outline: none;
        background: rgba(13, 17, 23, 0.8);
        border: 1px solid var(--vault-accent);
        color: var(--vault-accent);
        width: 100%;
        height: 100%;
        font-family: 'Roboto Mono', monospace;
        box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        transition: all 0.3s ease;
    }

    .search:focus {
        box-shadow: 0 0 25px rgba(88, 166, 255, 0.5);
        background: rgba(22, 27, 34, 1);
    }

    .title {
        position: absolute;
        width: 100%;
        top: 25%;
        text-align: center;
        color: #fff;
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 10px;
        text-shadow: 0 0 20px rgba(88, 166, 255, 0.6);
    }

    ::placeholder {
        color: rgba(88, 166, 255, 0.5);
        font-size: 0.9em;
        text-transform: uppercase;
    }

    /* Layout Elements */
    .apps, .games, .settings, .blank, .github, .discord, .chat {
        position: absolute;
        width: 60px;
        height: 60px;
        background: var(--vault-border);
        border: 1px solid var(--vault-accent);
        border-radius: 8px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .settings { left: 20px; top: 20px; }
    .apps { right: 100px; top: 20px; }
    .chat { right: 180px; top: 20px; }
    .games { right: 20px; top: 20px; }
    
    .discord { left: 45%; bottom: 50px; height: 50px; }
    .github { right: 45%; bottom: 50px; }

    .apps:hover, .games:hover, .settings:hover, .blank:hover, .github:hover, .discord:hover, .chat:hover {
        background: var(--vault-accent);
        transform: translateY(-5px);
        box-shadow: 0 0 20px var(--vault-accent);
    }

    .labels {
        font-size: 10px;
        color: var(--vault-accent);
        text-transform: uppercase;
        margin-top: 70px;
        font-family: 'Orbitron', sans-serif;
    }
</style>

<script>
    function gotocredits(){
        window.location.href=window.location.origin+"/credits";
    }
    
    if (get_cookie("autoblank")=="on"){
        if (window.top !== window) {
            var title2=get_cookie("title2");
            var favicon=get_cookie("favicon");

            if (!favicon){
                favicon="/img/logo.png";
                document.cookie="favicon="+favicon+"; expires=Thu, 18 Dec 9013 12:00:00 UTC; path=/";
            }
            
            var link=parent.document.createElement('link');
            link.type='image/x-icon';
            link.rel='shortcut icon';
            link.href=favicon;
            parent.document.getElementsByTagName('head')[0].appendChild(link);

            if (!title2){
                title2="The Vault";
                document.cookie="title2="+title2+"; expires=Thu, 18 Dec 9013 12:00:00 UTC; path=/";
                parent.document.title=title2;
            } else {
                parent.document.title=title2;
            }
        } else {
            blank();
        }
    }
    
    var title2=get_cookie("title2");
    var favicon=get_cookie("favicon");
    
    // Dynamic Font Logic preserved
    var fontsize1=2560/screen.width*18.5;
    var fontsize2=2560/screen.width*7.5;
    document.getElementById("title1").style.fontSize = fontsize1+"px";
    document.getElementById("search").style.fontSize = fontsize2+"px";
    
    if (!favicon){
        favicon="/img/logo.png";
        document.cookie="favicon="+favicon+"; expires=Thu, 18 Dec 9013 12:00:00 UTC; path=/";
    }
    
    (function() {
        var link=document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type='image/x-icon';
        link.rel='shortcut icon';
        link.href=favicon;
        document.getElementsByTagName('head')[0].appendChild(link);
    })();

    if (!title2){
        title2="The Vault";
        document.cookie="title2="+title2+"; expires=Thu, 18 Dec 9013 12:00:00 UTC; path=/";
        document.title=title2;
    } else {
        document.title=title2;
    }
</script>

<script>
    window.navigator.serviceWorker.register('./sw.js');
    
    var browsertype=get_cookie("browser3");
    if (!browsertype){
        browsertype="google";
        document.getElementById("searchengine").value="https://www.google.com/search?q=";
        document.cookie="browser3="+browsertype+"; expires=Thu, 18 Dec 9013 12:00:00 UTC; path=/";
    } else {
        const engines = {
            "google": "https://www.google.com/search?q=%s",
            "bing": "https://www.bing.com/search?q=%s",
            "yahoo": "https://search.yahoo.com/search?p=%s"
        };
        document.getElementById("searchengine").value = engines[browsertype] || engines["google"];
    }

    function isUrl(val = '') {
        if (/^http(s?):\/\//.test(val) || val.includes('.') && val.substr(0, 1) !== ' ') return true;
        return false;
    };
    
    document.addEventListener("DOMContentLoaded", function() {
        var searchEngine = document.getElementById("searchengine").value;
        var searchInput = document.getElementById("search");
        // Logic fix: Don't overwrite the placeholder with the URL immediately
    });

    function fade(){
        document.getElementById("loadimg").style.animation="linear 1.5s 1 running fadeout";
        document.getElementById("loadimg").addEventListener("animationend", () => {
            document.getElementById("black").style.animation="linear 1.5s 1 running fadeout";
            document.getElementById("black").addEventListener("animationend", () => {
                document.getElementById("black").remove();
            });
            document.getElementById("loadimg").remove();
        });
    }
    setTimeout(fade,1200);
</script>
